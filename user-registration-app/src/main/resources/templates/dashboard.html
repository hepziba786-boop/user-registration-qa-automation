<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">User App</a>
            <span id="welcomeMessage" class="text-white ms-auto">Welcome, <span th:text="${username}"></span>!</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div id="dashboardContainer" class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <h3 class="card-title mb-4">Dashboard</h3>
                        <p class="lead">Welcome to your profile dashboard</p>

                        <div class="d-grid gap-2">
                            <a href="/details/personal" class="btn btn-info" id="viewPersonalDetailsLink">View Personal Details</a>
                            <a href="/details/bank" class="btn btn-info" id="viewBankDetailsLink">View Bank Details</a>
                            <a href="/details/address" class="btn btn-info" id="viewAddressDetailsLink">View Address Details</a>
                            <a href="/logout" class="btn btn-danger" id="logoutButton">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
