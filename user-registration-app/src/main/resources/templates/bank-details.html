<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">User App</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Bank Details</h2>

                        <div id="errorMessages" class="alert alert-danger" role="alert" th:if="${errorMessages}" th:text="${errorMessages}"></div>
                        <div id="successMessage" class="alert alert-success" role="alert" th:if="${successMessage}" th:text="${successMessage}"></div>

                        <form th:action="@{/details/bank}" method="POST" th:object="${bankDetailsDTO}">
                            <div class="mb-3">
                                <label for="accountNumber" class="form-label">Account Number</label>
                                <input type="text" class="form-control" id="accountNumber" th:field="*{accountNumber}" placeholder="Enter account number">
                                <small class="text-danger" th:if="${#fields.hasErrors('accountNumber')}" th:errors="*{accountNumber}"></small>
                            </div>

                            <div class="mb-3">
                                <label for="accountType" class="form-label">Account Type</label>
                                <select class="form-select" id="accountType" th:field="*{accountType}">
                                    <option value="">Select account type</option>
                                    <option value="Savings">Savings</option>
                                    <option value="Current">Current</option>
                                    <option value="BusinessSavings">Business Savings</option>
                                </select>
                                <small class="text-danger" th:if="${#fields.hasErrors('accountType')}" th:errors="*{accountType}"></small>
                            </div>

                            <div class="mb-3">
                                <label for="IFSCCode" class="form-label">IFSC Code</label>
                                <input type="text" class="form-control" id="IFSCCode" th:field="*{IFSCCode}" placeholder="Enter IFSC code">
                                <small class="text-danger" th:if="${#fields.hasErrors('IFSCCode')}" th:errors="*{IFSCCode}"></small>
                            </div>

                            <div class="mb-3">
                                <label for="bankName" class="form-label">Bank Name</label>
                                <input type="text" class="form-control" id="bankName" th:field="*{bankName}" placeholder="Enter bank name">
                                <small class="text-danger" th:if="${#fields.hasErrors('bankName')}" th:errors="*{bankName}"></small>
                            </div>

                            <button type="submit" class="btn btn-success w-100" id="saveButton">Save</button>
                        </form>

                        <p class="text-center mt-3"><a href="/dashboard">Back to Dashboard</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
