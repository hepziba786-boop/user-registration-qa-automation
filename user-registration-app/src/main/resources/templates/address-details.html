<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">User App</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Address Details</h2>

                        <div id="errorMessages" class="alert alert-danger" role="alert" th:if="${errorMessages}" th:text="${errorMessages}"></div>
                        <div id="successMessage" class="alert alert-success" role="alert" th:if="${successMessage}" th:text="${successMessage}"></div>

                        <form th:action="@{/details/address}" method="POST" th:object="${addressDetailsDTO}">
                            <div class="mb-3">
                                <label for="street" class="form-label">Street Address</label>
                                <input type="text" class="form-control" id="street" th:field="*{street}" placeholder="Enter street address">
                                <small class="text-danger" th:if="${#fields.hasErrors('street')}" th:errors="*{street}"></small>
                            </div>

                            <div class="mb-3">
                                <label for="city" class="form-label">City</label>
                                <input type="text" class="form-control" id="city" th:field="*{city}" placeholder="Enter city">
                                <small class="text-danger" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></small>
                            </div>

                            <div class="mb-3">
                                <label for="state" class="form-label">State</label>
                                <input type="text" class="form-control" id="state" th:field="*{state}" placeholder="Enter state">
                                <small class="text-danger" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></small>
                            </div>

                            <div class="mb-3">
                                <label for="pincode" class="form-label">Pincode</label>
                                <input type="text" class="form-control" id="pincode" th:field="*{pincode}" placeholder="Enter pincode">
                                <small class="text-danger" th:if="${#fields.hasErrors('pincode')}" th:errors="*{pincode}"></small>
                            </div>

                            <div class="mb-3">
                                <label for="country" class="form-label">Country</label>
                                <input type="text" class="form-control" id="country" th:field="*{country}" placeholder="Enter country">
                                <small class="text-danger" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></small>
                            </div>

                            <button type="submit" class="btn btn-success w-100" id="saveButton">Save</button>
                        </form>

                        <p class="text-center mt-3"><a href="/dashboard">Back to Dashboard</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
